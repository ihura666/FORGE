name: FORGE Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest pyinstaller

      - name: Verify version consistency
        shell: bash
        run: |
          APP_VERSION=$(python -c "from forge_engine.cli import VERSION; print(VERSION)")

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"

            echo "Application version: ${APP_VERSION}"
            echo "Git tag version:     ${TAG_VERSION}"

            if [ "${APP_VERSION}" != "${TAG_VERSION}" ]; then
              echo "::error::Version mismatch: application=${APP_VERSION}, tag=${TAG_VERSION}"
              exit 1
            fi

            echo "Version consistency check: PASS"
          else
            echo "Application version: ${APP_VERSION}"
            echo "Reference:           ${GITHUB_REF_NAME}"
            echo "Version consistency check: skipped for non-tag build"
          fi

      - name: Run tests
        run: |
          python -m pytest -q

  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller

      - name: Build FORGE
        run: |
          pyinstaller --clean --onefile \
            --name FORGE \
            forge_engine/cli.py

      - name: Verify executable
        run: |
          test -f dist/FORGE
          chmod +x dist/FORGE
          ./dist/FORGE --version

      - name: Package
        shell: bash
        run: |
          VERSION=$(python -c "from forge_engine.cli import VERSION; print(VERSION)")

          mkdir -p "FORGE-${VERSION}"
          cp dist/FORGE "FORGE-${VERSION}/FORGE"

          sha256sum "FORGE-${VERSION}/FORGE" \
            > "FORGE-${VERSION}/FORGE.sha256"

          tar -czf \
            "FORGE-linux-x86_64.tar.gz" \
            "FORGE-${VERSION}"

      - name: Generate checksums
        run: |
          sha256sum FORGE-linux-x86_64.tar.gz \
            > FORGE-linux-x86_64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-linux-x86_64
          path: |
            FORGE-linux-x86_64.tar.gz
            FORGE-linux-x86_64.tar.gz.sha256

  windows:
    name: Windows x86-64
    runs-on: windows-latest
    needs:
      - tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Build FORGE
        shell: pwsh
        run: |
          pyinstaller --clean --onefile `
            --name FORGE `
            forge_engine/cli.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FORGE.exe")) {
            throw "FORGE.exe was not created"
          }

          & ".\dist\FORGE.exe" --version

      - name: Package
        shell: pwsh
        run: |
          $VERSION = python -c "from forge_engine.cli import VERSION; print(VERSION)"

          $DIR = "FORGE-$VERSION"

          New-Item -ItemType Directory -Force -Path $DIR | Out-Null

          Copy-Item `
            "dist\FORGE.exe" `
            "$DIR\FORGE.exe"

          $HASH = (Get-FileHash "$DIR\FORGE.exe" -Algorithm SHA256).Hash.ToLower()

          "$HASH  FORGE.exe" |
            Out-File `
              -Encoding ascii `
              "$DIR\FORGE.sha256"

          Compress-Archive `
            -Path "$DIR" `
            -DestinationPath "FORGE-windows-x86_64.zip" `
            -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $HASH = (Get-FileHash `
            "FORGE-windows-x86_64.zip" `
            -Algorithm SHA256).Hash.ToLower()

          "$HASH  FORGE-windows-x86_64.zip" |
            Out-File `
              -Encoding ascii `
              "FORGE-windows-x86_64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-windows-x86_64
          path: |
            FORGE-windows-x86_64.zip
            FORGE-windows-x86_64.zip.sha256

  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - tests
      - linux
      - windows

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release version
        shell: bash
        run: |
          APP_VERSION=$(python -c "from forge_engine.cli import VERSION; print(VERSION)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Application version: ${APP_VERSION}"
          echo "Git tag version:     ${TAG_VERSION}"

          if [ "${APP_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Release version mismatch"
            exit 1
          fi

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: FORGE-linux-x86_64
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FORGE-windows-x86_64
          path: release/windows

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release/final

          cp release/linux/FORGE-linux-x86_64.tar.gz \
            release/final/

          cp release/linux/FORGE-linux-x86_64.tar.gz.sha256 \
            release/final/

          cp release/windows/FORGE-windows-x86_64.zip \
            release/final/

          cp release/windows/FORGE-windows-x86_64.zip.sha256 \
            release/final/

          cd release/final

          sha256sum \
            FORGE-linux-x86_64.tar.gz \
            FORGE-windows-x86_64.zip \
            > SHA256SUMS.txt

          echo "Release contents:"
          ls -lh

          echo
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FORGE ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/final/FORGE-linux-x86_64.tar.gz
            release/final/FORGE-linux-x86_64.tar.gz.sha256
            release/final/FORGE-windows-x86_64.zip
            release/final/FORGE-windows-x86_64.zip.sha256
            release/final/SHA256SUMS.txt
