name: FORGE Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller

      - name: Run tests
        run: |
          python -m pytest -q

  linux:
    name: Linux x86-64
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --onefile \
            --name FORGE \
            forge_engine/cli.py

      - name: Package
        run: |
          mkdir -p release/FORGE-linux-x86_64
          cp dist/FORGE release/FORGE-linux-x86_64/FORGE

          cd release/FORGE-linux-x86_64

          sha256sum FORGE > FORGE.sha256

          tar -czf ../FORGE-linux-x86_64.tar.gz FORGE FORGE.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-linux-x86_64
          path: |
            release/FORGE-linux-x86_64/FORGE-linux-x86_64.tar.gz
            release/FORGE-linux-x86_64/FORGE.sha256

  windows:
    name: Windows x86-64
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --onefile `
            --name FORGE `
            forge_engine/cli.py

      - name: Verify
        shell: powershell
        run: |
          .\dist\FORGE.exe --version

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\FORGE.exe release\FORGE.exe
          Compress-Archive `
            -Path release\FORGE.exe `
            -DestinationPath release\FORGE-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-windows-x86_64
          path: release/FORGE-windows-x86_64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: FORGE-linux-x86_64
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FORGE-windows-x86_64
          path: release/windows

      - name: Generate release checksums
        shell: bash
        run: |
          mkdir -p release/final

          cp release/linux/FORGE-linux-x86_64.tar.gz \
            release/final/

          cp release/linux/FORGE.sha256 \
            release/final/FORGE-linux-x86_64.sha256

          cp release/windows/FORGE-windows-x86_64.zip \
            release/final/

          cd release/final

          sha256sum \
            FORGE-linux-x86_64.tar.gz \
            FORGE-windows-x86_64.zip \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/final/FORGE-linux-x86_64.tar.gz
            release/final/FORGE-windows-x86_64.zip
            release/final/FORGE-linux-x86_64.sha256
            release/final/SHA256SUMS.txt
