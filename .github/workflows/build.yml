name: FORGE Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller

      - name: Run tests
        run: |
          python -m pytest -q

  linux:
    name: Linux x86-64
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build FORGE
        run: |
          pyinstaller \
            --onefile \
            --name FORGE \
            forge_engine/cli.py

      - name: Package
        run: |
          mkdir -p release
          cp dist/FORGE release/FORGE
          tar -czf \
            release/FORGE-linux-x86_64.tar.gz \
            -C release FORGE

      - name: Generate checksums
        run: |
          cd release
          sha256sum FORGE \
            FORGE-linux-x86_64.tar.gz \
            > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-linux-x86_64
          path: release/

  windows:
    name: Windows x86-64
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build FORGE
        run: |
          pyinstaller `
            --onefile `
            --name FORGE `
            forge_engine/cli.py

      - name: Verify executable
        shell: powershell
        run: |
          .\dist\FORGE.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-windows-x86_64
          path: dist/FORGE.exe
