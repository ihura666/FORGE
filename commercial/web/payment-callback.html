<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FORGE Pro | Payment Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #05070a;
            color: #f4f7fb;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .panel {
            width: 100%;
            max-width: 620px;
            padding: 48px;
            border: 1px solid #1b222c;
            background: #090d12;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.65);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 60px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.22em;
        }

        .mark {
            width: 12px;
            height: 12px;
            background: #ffffff;
            box-shadow:
                0 0 18px rgba(255,255,255,.7);
        }

        .eyebrow {
            color: #7e8b9c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 18px;
            font-size: 42px;
            letter-spacing: -.045em;
        }

        p {
            color: #9aa7b7;
            line-height: 1.7;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #202934;
            background: #05070a;
            color: #c8d0da;
            line-height: 1.6;
        }

        .reference {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #1b222c;
            color: #697686;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .license {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #313b47;
            background: #0c1117;
        }

        .license-title {
            color: #7e8b9c;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .license-value {
            margin-top: 12px;
            color: #ffffff;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .06em;
            word-break: break-all;
        }

        .hidden {
            display: none;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 24px;
            border: 0;
            background: #ffffff;
            color: #05070a;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .error {
            color: #ff8585;
        }

        .success {
            color: #a9f0bb;
        }
    </style>
</head>

<body>

<main class="panel">

    <div class="brand">
        <span class="mark"></span>
        FORGE
    </div>

    <div class="eyebrow">
        Payment processing
    </div>

    <h1 id="title">
        Verifying payment
    </h1>

    <p id="message">
        Confirming your transaction with FORGE.
    </p>

    <div
        id="status"
        class="status"
    >
        Please wait...
    </div>

    <div
        id="referenceBox"
        class="reference hidden"
    >
        Reference:
        <span id="reference"></span>
    </div>

    <div
        id="licenseBox"
        class="license hidden"
    >
        <div class="license-title">
            License issued
        </div>

        <div
            id="licenseKey"
            class="license-value"
        ></div>

        <button
            id="copyButton"
            type="button"
        >
            Copy License Key
        </button>
    </div>

</main>

<script>
"use strict";

const API_BASE =
    "http://127.0.0.1:8787";

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const status =
    document.getElementById("status");

const referenceBox =
    document.getElementById(
        "referenceBox"
    );

const referenceElement =
    document.getElementById(
        "reference"
    );

const licenseBox =
    document.getElementById(
        "licenseBox"
    );

const licenseKey =
    document.getElementById(
        "licenseKey"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );

function setFailure(
    titleText,
    messageText
) {
    title.textContent =
        titleText;

    message.textContent =
        messageText;

    status.textContent =
        "Payment could not be confirmed.";

    status.className =
        "status error";
}

function setSuccess(
    messageText
) {
    title.textContent =
        "Payment confirmed";

    message.textContent =
        messageText;

    status.textContent =
        "Your FORGE Pro purchase has been completed.";

    status.className =
        "status success";
}

function getReference() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("reference") ||
        params.get("trxref") ||
        ""
    ).trim();
}

async function checkPayment(
    reference
) {
    const response =
        await fetch(
            `${API_BASE}/checkout/status/${encodeURIComponent(reference)}`
        );

    const data =
        await response.json();

    if (!response.ok) {
        throw new Error(
            data.error ||
            "Unable to retrieve payment status."
        );
    }

    return data;
}

async function pollPayment(
    reference
) {
    const maximumAttempts = 30;

    for (
        let attempt = 0;
        attempt < maximumAttempts;
        attempt++
    ) {

        const data =
            await checkPayment(
                reference
            );

        if (
            data.status ===
            "paid"
        ) {
            return data;
        }

        if (
            data.status ===
            "failed" ||
            data.status ===
            "amount_mismatch" ||
            data.status ===
            "currency_mismatch"
        ) {
            return data;
        }

        status.textContent =
            `Payment status: ${data.status}. Checking again...`;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    2000
                )
        );
    }

    throw new Error(
        "Payment verification timed out. Your transaction may still be processing."
    );
}

async function main() {

    const reference =
        getReference();

    if (!reference) {

        setFailure(
            "Missing payment reference",
            "No Paystack transaction reference was supplied."
        );

        return;
    }

    referenceElement.textContent =
        reference;

    referenceBox.classList.remove(
        "hidden"
    );

    try {

        const data =
            await pollPayment(
                reference
            );

        if (
            data.status ===
            "paid"
        ) {

            /*
             * The current server deliberately does not
             * expose the license key through the public
             * checkout status endpoint.
             *
             * Therefore the next commercial delivery
             * layer will retrieve the license securely.
             */

            setSuccess(
                "Payment received. Your license is being prepared."
            );

            status.textContent =
                "Payment verified. License fulfillment completed on the server.";

            return;
        }

        setFailure(
            "Payment not completed",
            `Current transaction status: ${data.status}`
        );

    } catch (error) {

        console.error(
            "Payment callback error:",
            error
        );

        setFailure(
            "Verification unavailable",
            error.message ||
            "Unable to verify the transaction."
        );
    }
}

copyButton.addEventListener(
    "click",
    async () => {

        const value =
            licenseKey.textContent;

        if (!value) {
            return;
        }

        try {

            await navigator.clipboard.writeText(
                value
            );

            copyButton.textContent =
                "Copied";

            setTimeout(
                () => {
                    copyButton.textContent =
                        "Copy License Key";
                },
                1500
            );

        } catch {

            copyButton.textContent =
                "Copy failed";
        }
    }
);

main();
</script>

</body>
</html>
