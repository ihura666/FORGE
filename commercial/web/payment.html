</div>

<script>
"use strict";

const API_BASE =
    window.FORGE_API_BASE ||
    "http://127.0.0.1:8787";

const params =
    new URLSearchParams(
        window.location.search
    );

const orderId =
    params.get("order_id") || "";

const txRef =
    params.get("tx_ref") || "";

const amount =
    params.get("amount") || "";

const currency =
    params.get("currency") || "";

const publicKey =
    params.get("public_key") || "";

const email =
    params.get("email") || "";

const name =
    params.get("name") || "";

const product =
    "FORGE Pro";

const customerElement =
    document.getElementById("customer");

const txRefElement =
    document.getElementById("txRef");

const amountElement =
    document.getElementById("amount");

const payButton =
    document.getElementById("payButton");

const statusBox =
    document.getElementById("status");

customerElement.textContent =
    email || "-";

txRefElement.textContent =
    txRef || "-";

amountElement.textContent =
    amount && currency
        ? `${amount} ${currency}`
        : "-";

function showStatus(
    message,
    type = ""
) {
    statusBox.textContent = message;

    statusBox.className =
        "status visible";

    if (type) {
        statusBox.classList.add(type);
    }
}

function loadFlutterwave() {
    return new Promise(
        (resolve, reject) => {

            if (
                window.FlutterwaveCheckout
            ) {
                resolve();
                return;
            }

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://checkout.flutterwave.com/v3.js";

            script.async = true;

            script.onload =
                () => resolve();

            script.onerror =
                () =>
                    reject(
                        new Error(
                            "Unable to load Flutterwave."
                        )
                    );

            document.head.appendChild(
                script
            );
        }
    );
}

function validateOrderData() {
    if (!orderId) {
        throw new Error(
            "Missing order ID."
        );
    }

    if (!txRef) {
        throw new Error(
            "Missing transaction reference."
        );
    }

    if (!amount) {
        throw new Error(
            "Missing payment amount."
        );
    }

    if (!currency) {
        throw new Error(
            "Missing payment currency."
        );
    }

    if (!publicKey) {
        throw new Error(
            "Payment provider configuration is incomplete."
        );
    }

    if (!email) {
        throw new Error(
            "Customer email is missing."
        );
    }
}

async function startPayment() {
    try {
        validateOrderData();

        payButton.disabled = true;

        payButton.innerHTML =
            '<span class="spinner"></span>Loading payment...';

        await loadFlutterwave();

        showStatus(
            "Opening secure payment...",
            ""
        );

        FlutterwaveCheckout({
            public_key: publicKey,

            tx_ref: txRef,

            amount: Number(amount),

            currency: currency,

            payment_options:
                "card,banktransfer,ussd",

            customer: {
                email: email,
                name: name || "FORGE Customer"
            },

            customizations: {
                title: "FORGE Pro",
                description:
                    "Professional FORGE license",
                logo: ""
            },

            callback: function (payment) {
                handlePaymentCallback(
                    payment
                );
            },

            onclose: function () {
                payButton.disabled = false;

                payButton.textContent =
                    "Pay with Flutterwave";

                showStatus(
                    "Payment window closed. No license has been issued.",
                    ""
                );
            }
        });

    } catch (error) {
        console.error(
            "Payment initialization error:",
            error
        );

        showStatus(
            error.message ||
            "Unable to initialize payment.",
            "error"
        );

        payButton.disabled = false;

        payButton.textContent =
            "Pay with Flutterwave";
    }
}

async function handlePaymentCallback(
    payment
) {
    console.log(
        "Flutterwave callback:",
        payment
    );

    showStatus(
        "Payment response received. The server is verifying the transaction...",
        ""
    );

    payButton.disabled = true;

    /*
     * IMPORTANT:
     *
     * The callback is NOT trusted as proof of payment.
     *
     * The Flutterwave webhook handled by server.js
     * remains authoritative.
     */

    if (
        payment &&
        (
            payment.status ===
                "successful" ||
            payment.status ===
                "completed"
        )
    ) {
        showStatus(
            "Payment submitted. Verification is being completed by the FORGE server.",
            "success"
        );

        payButton.textContent =
            "Payment submitted";

        /*
         * Give the webhook a short opportunity
         * to process the transaction, then return
         * the customer to the main page.
         */
        setTimeout(
            () => {
                window.location.href =
                    "index.html?payment=pending";
            },
            2500
        );

        return;
    }

    showStatus(
        "Payment was not completed.",
        "error"
    );

    payButton.disabled = false;

    payButton.textContent =
        "Pay with Flutterwave";
}

if (!orderId) {
    showStatus(
        "This payment session is invalid or incomplete.",
        "error"
    );

    payButton.disabled = true;
} else {
    payButton.addEventListener(
        "click",
        startPayment
    );
}
</script>
