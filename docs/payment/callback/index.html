<body>

<main class="card">

```
<div class="logo">FORGE</div>

<h1 id="title">Checking payment...</h1>

<p id="description">
    Verifying your transaction securely.
</p>

<div
    id="status"
    class="status loading"
>
    Please wait.
</div>

<a
    id="home"
    href="/FORGE/"
    style="display:none;"
>
    Return to FORGE
</a>
```

</main>

<script>
"use strict";

const API_BASE =
    window.FORGE_API_BASE ||
    "http://127.0.0.1:8787";

const params =
    new URLSearchParams(
        window.location.search
    );

const reference =
    params.get("reference") ||
    params.get("trxref");

const title =
    document.getElementById("title");

const description =
    document.getElementById("description");

const status =
    document.getElementById("status");

const home =
    document.getElementById("home");

function showError(message) {
    title.textContent =
        "Payment verification failed";

    description.textContent =
        "The transaction could not be confirmed.";

    status.className =
        "status error";

    status.textContent =
        message;

    home.style.display =
        "inline-block";
}

async function verifyPayment() {

    if (!reference) {
        showError(
            "No payment reference was supplied."
        );

        return;
    }

    try {

        const response =
            await fetch(
                API_BASE +
                "/checkout/status/" +
                encodeURIComponent(
                    reference
                )
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to verify payment."
            );
        }

        if (
            data.status === "paid" &&
            data.license_issued
        ) {

            title.textContent =
                "Payment successful";

            description.textContent =
                "Your FORGE Pro purchase has been confirmed.";

            status.className =
                "status success";

            status.innerHTML =
                "FORGE Pro is ready.<br>" +
                "Your license has been issued.";

            home.style.display =
                "inline-block";

            return;
        }

        if (
            data.status === "pending"
        ) {

            title.textContent =
                "Payment received";

            description.textContent =
                "Your payment is still being confirmed.";

            status.className =
                "status loading";

            status.textContent =
                "Keep this page open. We are waiting for payment confirmation.";

            setTimeout(
                verifyPayment,
                3000
            );

            return;
        }

        showError(
            "The transaction status is: " +
            data.status
        );

    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message ||
            "Unable to contact the FORGE payment server."
        );
    }
}

verifyPayment();
</script>

</body>
